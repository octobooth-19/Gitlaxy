<style>
/* ---- 00-base.css ---- */
/* Gitlaxy — 00-base.css: design tokens, resets and shared primitives (owned by coordinator). */
:root {
  --bg: #03050b;
  --panel: rgba(13, 17, 23, .58);
  --panel-strong: rgba(13, 17, 23, .86);
  --border: rgba(240, 246, 252, .10);
  --border-strong: rgba(240, 246, 252, .20);
  --text: #e6edf3;
  --muted: #8b949e;
  --faint: #6e7681;
  --accent: #58a6ff;
  --accent-2: #a371f7;
  --accent-3: #ff7b72;
  --green: #3fb950;
  --yellow: #e3b341;
  --orange: #f0883e;
  --red: #f85149;
  --grad: linear-gradient(90deg, #79c0ff 0%, #d2a8ff 50%, #ff7b72 100%);
  --radius: 14px;
  --radius-sm: 10px;
  --blur: 16px;
  --shadow: 0 12px 40px rgba(0, 0, 0, .45);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --z-labels: 5;
  --z-hud: 10;
  --z-chrome: 20;
  --z-modal: 40;
  --z-toast: 50;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

* { scrollbar-width: thin; scrollbar-color: rgba(240, 246, 252, .18) transparent; }
::selection { background: rgba(88, 166, 255, .35); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
input, button, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#glx-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  display: block;
  touch-action: none;
  outline: none;
  cursor: grab;
  -webkit-user-select: none;
  user-select: none;
  background: var(--bg);
}
#glx-canvas.is-hovering { cursor: pointer; }
#glx-canvas.is-dragging { cursor: grabbing; }

#glx-vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(ellipse 120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, .55) 100%),
    radial-gradient(ellipse 60% 40% at 50% 110%, rgba(56, 139, 253, .06), transparent 70%);
}

#glx-labels, #glx-hud-root, #glx-chrome-root {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
#glx-labels { z-index: var(--z-labels); overflow: hidden; }
#glx-hud-root { z-index: var(--z-hud); }
#glx-chrome-root { z-index: var(--z-chrome); }

.glass {
  background: var(--panel);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  backdrop-filter: blur(var(--blur)) saturate(140%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 38px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: rgba(240, 246, 252, .06);
  color: var(--text);
  font: 600 14px/1 var(--font);
  white-space: nowrap;
  cursor: pointer;
  text-decoration: none;
  transition: background .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease), filter .18s var(--ease);
}
.btn:hover { background: rgba(240, 246, 252, .12); border-color: rgba(240, 246, 252, .3); text-decoration: none; }
.btn:active { transform: translateY(1px) scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary {
  border: 0;
  background: var(--grad);
  color: #0d1117;
  box-shadow: 0 6px 24px rgba(163, 113, 247, .35);
}
.btn-primary:hover { background: var(--grad); filter: brightness(1.08); box-shadow: 0 8px 30px rgba(163, 113, 247, .5); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: rgba(240, 246, 252, .06); border-color: transparent; color: var(--text); }

.icon-btn {
  appearance: none;
  width: 36px;
  height: 36px;
  padding: 0;
  display: inline-grid;
  place-items: center;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(13, 17, 23, .5);
  color: var(--text);
  cursor: pointer;
  transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
}
.icon-btn:hover { background: rgba(240, 246, 252, .1); border-color: var(--border-strong); }
.icon-btn:active { transform: scale(.94); }
.icon-btn[aria-pressed="true"] { color: var(--accent); border-color: rgba(88, 166, 255, .5); background: rgba(56, 139, 253, .15); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(240, 246, 252, .06);
  color: var(--text);
  font-size: 12px;
  white-space: nowrap;
}

.kbd {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 5px;
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  background: rgba(240, 246, 252, .06);
  color: var(--text);
  font: 600 11px/1 var(--mono);
}

.mono { font-family: var(--mono); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.icon { display: block; flex: none; }
.sr-only {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.glx-fatal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-content: center;
  gap: 8px;
  padding: 32px;
  text-align: center;
  background: radial-gradient(ellipse at center, #0d1117, var(--bg));
  color: var(--text);
}
.glx-fatal h1 { margin: 0; font-size: 28px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.glx-fatal p { margin: 0 auto; max-width: 520px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---- 60-hud.css ---- */
/* Gitlaxy — 60-hud.css · GLX.HUD: profile, legend, star card, tooltip, labels, merge UI, find-a-star palette.
   Every class is hud-* ; tokens fall back to the §8 values if 00-base.css is absent. */

.hud, .hud-s, .hud-label {
  --hud-panel: var(--panel, rgba(13, 17, 23, .58));
  --hud-panel-strong: var(--panel-strong, rgba(13, 17, 23, .86));
  --hud-border: var(--border, rgba(240, 246, 252, .10));
  --hud-border-strong: var(--border-strong, rgba(240, 246, 252, .20));
  --hud-text: var(--text, #e6edf3);
  --hud-muted: var(--muted, #8b949e);
  --hud-faint: var(--faint, #6e7681);
  --hud-accent: var(--accent, #58a6ff);
  --hud-accent-2: var(--accent-2, #a371f7);
  --hud-green: var(--green, #3fb950);
  --hud-yellow: var(--yellow, #e3b341);
  --hud-orange: var(--orange, #f0883e);
  --hud-red: var(--red, #f85149);
  --hud-grad: var(--grad, linear-gradient(90deg, #79c0ff 0%, #d2a8ff 50%, #ff7b72 100%));
  --hud-radius: var(--radius, 14px);
  --hud-radius-sm: var(--radius-sm, 10px);
  --hud-blur: var(--blur, 16px);
  --hud-shadow: var(--shadow, 0 12px 40px rgba(0, 0, 0, .45));
  --hud-font: var(--font, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif);
  --hud-mono: var(--mono, ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace);
  --hud-ease: var(--ease, cubic-bezier(.2, .8, .2, 1));
  --hud-well: rgba(1, 4, 9, .36);
  --hud-hair: rgba(240, 246, 252, .07);
}

.hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  font-family: var(--hud-font);
  font-size: 13px;
  line-height: 1.45;
  color: var(--hud-text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.hud *, .hud *::before, .hud *::after,
.hud-s *, .hud-s *::before, .hud-s *::after { box-sizing: border-box; }
.hud h2, .hud h3, .hud p { margin: 0; }
.hud ul { list-style: none; margin: 0; padding: 0; }
.hud button, .hud-s button { font-family: inherit; }
.hud a { color: inherit; }
.hud :focus-visible, .hud-s :focus-visible { outline: 2px solid var(--hud-accent); outline-offset: 2px; }
.hud :focus:not(:focus-visible) { outline: none; }

.hud-sr {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
.hud-ico { display: inline-grid; place-items: center; flex: none; line-height: 0; }
.hud-ico .icon { display: block; }
.hud-muted { color: var(--hud-muted); font-size: 12.5px; }

/* ------------------------------------------------------------------ glass panels */
.hud-panel {
  position: absolute;
  pointer-events: auto;
  color: var(--hud-text);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 96px),
    var(--hud-panel);
  border: 1px solid var(--hud-border);
  border-radius: var(--hud-radius);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 0 0 1px rgba(0, 0, 0, .22), var(--hud-shadow);
  -webkit-backdrop-filter: blur(var(--hud-blur)) saturate(165%);
  backdrop-filter: blur(var(--hud-blur)) saturate(165%);
}

/* Panels in the left column mount with an entrance animation (display toggles, so no layout gap). */
.hud-left {
  position: absolute;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: calc(16px + env(safe-area-inset-left, 0px));
  bottom: 16px;
  width: 336px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  pointer-events: none;
}
.hud-left > .hud-panel { position: relative; flex: 0 1 auto; min-height: 0; width: 100%; }
.hud-left > .hud-panel:not(.is-visible) { display: none; }
.hud-left > .hud-panel.is-visible { animation: hud-rise .5s var(--hud-ease) both; }
.hud-left > .hud-legend { flex: 0 0 auto; width: 248px; animation-delay: .08s; }

/* Card / summary: transition in and out (visibility keeps hidden panels out of the tab order). */
.hud-pop {
  opacity: 0;
  visibility: hidden;
  transition: opacity .26s var(--hud-ease), transform .34s var(--hud-ease), visibility 0s linear .34s;
}
.hud-pop.is-visible { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }

/* ------------------------------------------------------------------ buttons */
.hud-btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid rgba(240, 246, 252, .14);
  background: rgba(240, 246, 252, .06);
  color: var(--hud-text);
  font: 600 13px/1 var(--hud-font);
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition: background .18s var(--hud-ease), border-color .18s var(--hud-ease), transform .12s var(--hud-ease), box-shadow .2s var(--hud-ease), filter .2s;
}
.hud-btn:hover { background: rgba(240, 246, 252, .11); border-color: rgba(240, 246, 252, .26); }
.hud-btn:active { transform: translateY(1px) scale(.985); }
.hud-btn .icon { opacity: .9; }
.hud-btn-primary {
  border-color: transparent;
  color: #0b0f17;
  background: var(--hud-grad);
  box-shadow: 0 8px 24px -10px rgba(210, 168, 255, .75), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.hud-btn-primary:hover { background: var(--hud-grad); border-color: transparent; filter: brightness(1.08) saturate(1.05); box-shadow: 0 10px 28px -8px rgba(210, 168, 255, .85), inset 0 1px 0 rgba(255, 255, 255, .4); }
.hud-btn-ghost { background: transparent; }
.hud-btn-sm { height: 30px; padding: 0 11px; border-radius: 8px; font-size: 12px; gap: 6px; }
.hud-btn-wide { flex: 1 1 auto; justify-content: center; }

.hud-icon-btn {
  appearance: none;
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--hud-muted);
  cursor: pointer;
  transition: background .18s var(--hud-ease), color .18s var(--hud-ease), transform .12s var(--hud-ease);
}
.hud-icon-btn:hover { background: rgba(240, 246, 252, .09); color: var(--hud-text); }
.hud-icon-btn:active { transform: scale(.92); }
.hud-link-btn {
  appearance: none;
  margin-top: 6px;
  padding: 2px 0;
  border: 0;
  background: none;
  color: var(--hud-accent);
  font: 600 12px/1.4 var(--hud-font);
  cursor: pointer;
}
.hud-link-btn:hover { text-decoration: underline; text-underline-offset: 2px; }
.hud-kbd {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 5px;
  border: 1px solid rgba(240, 246, 252, .16);
  border-bottom-width: 2px;
  background: rgba(240, 246, 252, .05);
  color: var(--hud-muted);
  font: 600 11px/1 var(--hud-mono);
}

/* ------------------------------------------------------------------ shared bits */
.hud-avatar {
  position: relative;
  display: inline-grid;
  place-items: center;
  flex: none;
  border-radius: 50%;
  border: 2px solid transparent;
  background: var(--hud-av, #30363d) padding-box, var(--hud-grad) border-box;
  color: #fff;
  font-weight: 700;
  letter-spacing: .02em;
  overflow: hidden;
  box-shadow: 0 0 18px -4px rgba(163, 113, 247, .55);
}
.hud-avatar-ini { line-height: 1; text-shadow: 0 1px 2px rgba(0, 0, 0, .35); }
.hud-avatar img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  opacity: 0;
  transition: opacity .35s var(--hud-ease);
}
.hud-avatar img.is-loaded { opacity: 1; }

.hud-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 8px;
  border-radius: 999px;
  border: 1px solid;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .01em;
  white-space: nowrap;
}
.hud-badge-org, .hud-badge-fork { color: #79c0ff; background: rgba(56, 139, 253, .12); border-color: rgba(56, 139, 253, .32); }
.hud-badge-demo { color: #d2a8ff; background: rgba(163, 113, 247, .13); border-color: rgba(163, 113, 247, .34); }
.hud-badge-archived { color: var(--hud-yellow); background: rgba(227, 179, 65, .10); border-color: rgba(227, 179, 65, .32); }
.hud-badge-active { color: #56d364; background: rgba(63, 185, 80, .12); border-color: rgba(63, 185, 80, .34); }
.hud-badge-recent { color: var(--hud-muted); background: rgba(240, 246, 252, .05); border-color: rgba(240, 246, 252, .14); }
.hud-pulse {
  position: relative;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  margin-right: 2px;
}
.hud-pulse::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: currentColor;
  animation: hud-ping 1.8s cubic-bezier(0, 0, .2, 1) infinite;
}

.hud-h {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 16px 0 7px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--hud-faint);
}
.hud-h-count {
  display: inline-grid;
  place-items: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: rgba(240, 136, 62, .16);
  color: var(--hud-orange);
  font-size: 10.5px;
  letter-spacing: 0;
}
.hud-desig {
  font-family: var(--hud-mono);
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--hud-faint);
  white-space: nowrap;
}

.hud-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hud-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid rgba(240, 246, 252, .09);
  background: rgba(240, 246, 252, .055);
  color: #c9d1d9;
  font-size: 12px;
  white-space: nowrap;
}
.hud-chip .icon { color: var(--hud-muted); }
.hud-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }

.hud-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hud-tiles-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.hud-tile {
  min-width: 0;
  padding: 10px 11px 9px;
  border-radius: 12px;
  border: 1px solid rgba(240, 246, 252, .06);
  background: var(--hud-well);
}
.hud-tile-v {
  display: block;
  font-size: 18px;
  font-weight: 650;
  line-height: 1.15;
  letter-spacing: -.01em;
  color: #f0f6fc;
  font-variant-numeric: tabular-nums;
}
.hud-tile-l {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 3px;
  font-size: 11px;
  color: var(--hud-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hud-tile.is-stars .hud-ico { color: var(--hud-yellow); }
.hud-tile.is-warn .hud-ico { color: var(--hud-orange); }

/* ------------------------------------------------------------------ profile panel */
.hud-profile { display: flex; flex-direction: column; overflow: hidden; }
.hud-prof-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 14px 10px 14px 14px;
  flex: none;
}
.hud-prof-id { min-width: 0; }
.hud-prof-name {
  font-size: 16px;
  font-weight: 650;
  line-height: 1.25;
  letter-spacing: -.012em;
  color: #f0f6fc;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hud-prof-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
.hud-login { color: var(--hud-muted); font-size: 13px; text-decoration: none; transition: color .15s; }
.hud-login:hover { color: var(--hud-accent); text-decoration: underline; text-underline-offset: 2px; }
.hud-collapse { align-self: start; }
.hud-collapse .icon { transform: rotate(-90deg); transition: transform .3s var(--hud-ease); }
.hud-profile.is-collapsed .hud-collapse .icon { transform: rotate(90deg); }

.hud-prof-body {
  display: grid;
  grid-template-rows: 1fr;
  flex: 1 1 auto;
  min-height: 0;
  transition: grid-template-rows .36s var(--hud-ease), opacity .26s var(--hud-ease);
}
.hud-prof-inner {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 14px 14px;
  scrollbar-width: thin;
  scrollbar-color: rgba(240, 246, 252, .16) transparent;
}
.hud-profile.is-collapsed .hud-prof-body { grid-template-rows: 0fr; opacity: 0; }
.hud-profile.is-collapsed .hud-prof-inner { visibility: hidden; transition: visibility 0s linear .36s; }

.hud-class-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hud-class {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 28px;
  padding: 3px 12px 3px 9px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: linear-gradient(rgba(19, 24, 33, .96), rgba(19, 24, 33, .96)) padding-box, var(--hud-grad) border-box;
  box-shadow: 0 0 22px -6px rgba(163, 113, 247, .55);
  color: #f0f6fc;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.hud-class-emoji { font-size: 15px; line-height: 1; }
.hud-blurb { margin-top: 9px; font-size: 12.5px; line-height: 1.5; color: var(--hud-muted); }

.hud-stats {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  margin-top: 12px;
  padding: 10px 0 9px;
  border-radius: 12px;
  border: 1px solid rgba(240, 246, 252, .06);
  background: var(--hud-well);
}
.hud-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.hud-stat + .hud-stat { border-left: 1px solid var(--hud-hair); }
.hud-stat-v {
  font-size: 15px;
  font-weight: 650;
  line-height: 1.1;
  color: #f0f6fc;
  font-variant-numeric: tabular-nums;
}
.hud-stat-l { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--hud-muted); white-space: nowrap; }
.hud-stat-l .icon { opacity: .85; }
.hud-stat.is-stars .hud-stat-l .hud-ico { color: var(--hud-yellow); }

.hud-note {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  margin-top: 10px;
  padding: 7px 10px;
  border-radius: 10px;
  border: 1px solid rgba(227, 179, 65, .2);
  background: rgba(227, 179, 65, .07);
  color: #d4b25e;
  font-size: 12px;
  line-height: 1.4;
}
.hud-note .hud-ico { margin-top: 2px; }

.hud-facts { display: flex; flex-direction: column; gap: 1px; }
.hud-fact {
  appearance: none;
  width: 100%;
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto 14px;
  align-items: center;
  gap: 10px;
  padding: 6px 6px 6px 6px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: background .18s var(--hud-ease);
}
.hud-profile.is-visible .hud-fact { animation: hud-fade-up .5s var(--hud-ease) both; animation-delay: calc(var(--i, 0) * 45ms + 160ms); }
.hud-fact:hover { background: rgba(240, 246, 252, .06); }
.hud-fact-ico {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  color: var(--c);
  background: rgba(240, 246, 252, .05);
  background: color-mix(in srgb, var(--c) 13%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 26%, transparent);
}
.hud-fact-main { display: flex; flex-direction: column; min-width: 0; }
.hud-fact-label { font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--hud-faint); }
.hud-fact-text { font-size: 13px; font-weight: 600; color: #e6edf3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-fact-value { font-size: 12px; color: var(--hud-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hud-fact-go { color: var(--hud-muted); opacity: 0; transform: translateX(-4px); transition: opacity .18s, transform .22s var(--hud-ease); }
.hud-fact:hover .hud-fact-go, .hud-fact:focus-visible .hud-fact-go { opacity: .9; transform: none; }

.hud-source {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--hud-hair);
  font-size: 11px;
  color: var(--hud-faint);
}
.hud-source-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hud-green); box-shadow: 0 0 8px var(--hud-green); flex: none; }
.hud-source.is-cache .hud-source-dot { background: var(--hud-yellow); box-shadow: 0 0 8px var(--hud-yellow); }
.hud-source.is-demo .hud-source-dot { background: #d2a8ff; box-shadow: 0 0 8px #d2a8ff; }

/* ------------------------------------------------------------------ legend */
.hud-legend { padding: 10px 6px 6px; }
.hud-legend-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 8px 6px; }
.hud-legend-title { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--hud-faint); }
.hud-legend-hint { font-size: 10.5px; color: var(--hud-faint); opacity: .8; }
.hud-legend-list { display: flex; flex-direction: column; gap: 1px; }
.hud-lang-extra { display: none; }
.hud-legend.is-expanded .hud-lang-extra { display: block; }
.hud-legend.is-expanded .hud-legend-list { max-height: 300px; overflow-y: auto; scrollbar-width: thin; }
.hud-lang {
  appearance: none;
  position: relative;
  width: 100%;
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  height: 31px;
  padding: 0 10px 2px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #d5dde5;
  font: 500 13px/1 var(--hud-font);
  text-align: left;
  cursor: pointer;
  transition: background .18s var(--hud-ease), opacity .25s var(--hud-ease), color .18s, box-shadow .2s;
}
.hud-legend.is-visible .hud-lang { animation: hud-fade-up .45s var(--hud-ease) both; animation-delay: calc(var(--i, 0) * 35ms + 140ms); }
.hud-lang-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--c);
  box-shadow: 0 0 0 2px rgba(1, 4, 9, .35), 0 0 10px -1px var(--c);
  transition: transform .2s var(--hud-ease), box-shadow .2s;
}
.hud-lang-name { display: flex; align-items: center; gap: 5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-lang-shared { color: var(--hud-accent-2); font-size: 11px; opacity: .85; }
.hud-lang-count { font-size: 12px; color: var(--hud-muted); font-variant-numeric: tabular-nums; }
.hud-lang-bar {
  position: absolute;
  left: 30px;
  right: 10px;
  bottom: 4px;
  height: 2px;
  border-radius: 2px;
  background: rgba(240, 246, 252, .06);
  overflow: hidden;
}
.hud-lang-bar > i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--c);
  opacity: .7;
  transform-origin: left center;
  transition: opacity .2s;
}
.hud-legend.is-visible .hud-lang-bar > i { animation: hud-grow .9s var(--hud-ease) both; animation-delay: calc(var(--i, 0) * 35ms + 260ms); }
.hud-lang:hover, .hud-lang.is-hl { background: rgba(240, 246, 252, .07); color: #fff; }
.hud-lang:hover .hud-lang-dot, .hud-lang.is-hl .hud-lang-dot { transform: scale(1.2); box-shadow: 0 0 0 2px rgba(1, 4, 9, .35), 0 0 14px 1px var(--c); }
.hud-lang:hover .hud-lang-bar > i, .hud-lang.is-hl .hud-lang-bar > i { opacity: 1; }
.hud-lang.is-solo {
  color: #fff;
  background: rgba(240, 246, 252, .08);
  background: color-mix(in srgb, var(--c) 15%, transparent);
  box-shadow: inset 0 0 0 1px rgba(240, 246, 252, .2);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 48%, transparent);
}
.hud-lang.is-solo .hud-lang-count { color: #e6edf3; }
.hud-lang.is-solo .hud-lang-bar > i { opacity: 1; }
.hud-lang.is-dim { opacity: .36; }
.hud-lang.is-dim:hover { opacity: .75; }
.hud-legend.has-hl:not(.has-solo) .hud-lang:not(.is-hl) { opacity: .55; }
.hud-legend-more {
  appearance: none;
  display: block;
  width: 100%;
  margin-top: 2px;
  padding: 6px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--hud-muted);
  font: 600 11.5px/1.2 var(--hud-font);
  text-align: left;
  cursor: pointer;
}
.hud-legend-more:hover { color: var(--hud-text); background: rgba(240, 246, 252, .05); }

/* ------------------------------------------------------------------ star card */
.hud-card {
  top: calc(72px + env(safe-area-inset-top, 0px));
  right: calc(16px + env(safe-area-inset-right, 0px));
  width: 372px;
  max-height: min(720px, calc(100% - 88px));
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 120px),
    rgba(13, 17, 23, .74);
  transform: translateX(22px) scale(.985);
  transform-origin: right center;
}
.hud-card::before {
  content: '';
  position: absolute;
  inset: 0 0 auto 0;
  height: 190px;
  pointer-events: none;
  background: radial-gradient(130% 100% at 0% 0%, rgba(88, 166, 255, .14), transparent 68%);
  background: radial-gradient(130% 100% at 0% 0%, color-mix(in srgb, var(--c, #58a6ff) 22%, transparent), transparent 68%);
}
.hud-card::after {
  content: '';
  position: absolute;
  left: 18px;
  right: 18px;
  top: 0;
  height: 1px;
  pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--c, #58a6ff), transparent);
  opacity: .85;
}
.hud-grip { display: none; }
.hud-card-bar {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 10px 0 18px;
  flex: none;
}
.hud-card-kicker {
  min-width: 0;
  font-family: var(--hud-mono);
  font-size: 10.5px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--hud-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hud-card-nav { display: flex; gap: 2px; flex: none; }
.hud-card-scroll {
  position: relative;
  z-index: 1;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 2px 18px 18px;
  scrollbar-width: thin;
  scrollbar-color: rgba(240, 246, 252, .16) transparent;
}
.hud-card-head {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  padding: 4px 0 14px;
}
.hud-orb {
  position: relative;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  --s: .8;
  background: radial-gradient(circle, #fff 0 6%, var(--c) 20%, transparent 64%);
  background: radial-gradient(circle,
    #fff 0 calc(var(--s) * 7%),
    color-mix(in srgb, var(--c) 55%, #fff) calc(var(--s) * 13%),
    color-mix(in srgb, var(--c) 60%, transparent) calc(var(--s) * 24%),
    color-mix(in srgb, var(--c) 16%, transparent) calc(var(--s) * 46%),
    transparent 70%);
}
.hud-orb::before, .hud-orb::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--c), transparent);
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 60%, #fff), transparent);
  transform: translate(-50%, -50%);
  opacity: .8;
}
.hud-orb::after { transform: translate(-50%, -50%) rotate(90deg); }
.hud-orb.is-active { animation: hud-orb 2.8s ease-in-out infinite; }
.hud-card-titles { min-width: 0; }
.hud-card-title { font-size: 19px; font-weight: 650; line-height: 1.25; letter-spacing: -.014em; overflow-wrap: anywhere; }
.hud-card-link { color: #f0f6fc; text-decoration: none; border-radius: 4px; }
.hud-card-link:hover { color: #fff; text-decoration: underline; text-decoration-color: rgba(240, 246, 252, .35); text-underline-offset: 3px; }
.hud-card-ext { display: inline-grid; margin-left: 6px; color: var(--hud-faint); vertical-align: -1px; transition: color .15s, transform .2s var(--hud-ease); }
.hud-card-link:hover .hud-card-ext { color: var(--hud-accent); transform: translate(1px, -1px); }
.hud-card-owner { margin-top: 2px; font-size: 12.5px; color: var(--hud-muted); }
.hud-card-body > * + * { margin-top: 14px; }
.hud-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.hud-card-desc { font-size: 13.5px; line-height: 1.55; color: #c9d1d9; overflow-wrap: anywhere; }
.hud-card-desc.is-empty { color: var(--hud-faint); font-style: italic; }

.hud-meta {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 9px 14px;
  margin: 0;
  padding: 12px 0 2px;
  border-top: 1px solid var(--hud-hair);
  font-size: 12.5px;
}
.hud-meta dt { display: flex; align-items: center; gap: 7px; color: var(--hud-muted); }
.hud-meta dt .icon { opacity: .8; }
.hud-meta dd { margin: 0; text-align: right; color: #e6edf3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.hud-meta-sub { color: var(--hud-faint); }
.hud-meta a { color: var(--hud-accent); text-decoration: none; }
.hud-meta a:hover { text-decoration: underline; text-underline-offset: 2px; }

.hud-topics { display: flex; flex-wrap: wrap; gap: 6px; }
.hud-topic {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 9px;
  border-radius: 999px;
  border: 1px solid rgba(56, 139, 253, .24);
  background: rgba(56, 139, 253, .10);
  color: #79c0ff;
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
}

.hud-planets {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--hud-hair);
  background: linear-gradient(90deg, rgba(240, 246, 252, .05), rgba(240, 246, 252, .012));
  font-size: 12.5px;
  line-height: 1.45;
  color: #c9d1d9;
}
.hud-planets b { color: #fff; font-weight: 650; }
.hud-orbit { position: relative; display: grid; place-items: center; width: 46px; height: 46px; }
.hud-orbit-ring {
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  border: 1px dashed rgba(240, 246, 252, .2);
  animation: hud-spin 16s linear infinite;
}
.hud-orbit-ring > i {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 5px;
  margin: -2.5px 0 0 -2.5px;
  border-radius: 50%;
  background: var(--c);
  box-shadow: 0 0 6px var(--c);
  transform: rotate(var(--a)) translateX(19.5px);
}
.hud-orbit-core { font-size: 17px; line-height: 1; filter: drop-shadow(0 0 6px rgba(255, 255, 255, .25)); }
.hud-card-actions { display: flex; gap: 8px; }

/* ------------------------------------------------------------------ tooltip */
.hud-tip {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 6;
  max-width: 280px;
  min-width: 150px;
  padding: 9px 12px 10px;
  border-radius: 12px;
  border: 1px solid rgba(240, 246, 252, .14);
  background: rgba(13, 17, 23, .88);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .05);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  pointer-events: none;
  opacity: 0;
  transition: opacity .14s var(--hud-ease);
  will-change: transform, opacity;
}
.hud-tip::after {
  content: '';
  position: absolute;
  left: 12px;
  right: 12px;
  top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--c, #58a6ff), transparent);
  opacity: .7;
}
.hud-tip.is-visible { opacity: 1; }
.hud-tip-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; color: #f0f6fc; }
.hud-tip-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 8px var(--c); }
.hud-tip-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-tip-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; padding-left: 16px; font-size: 11.5px; color: var(--hud-muted); }
.hud-tip-stars { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.hud-tip-stars .hud-ico { color: var(--hud-yellow); }
.hud-tip-tag { padding: 0 6px; border-radius: 999px; background: rgba(240, 246, 252, .07); font-size: 10.5px; line-height: 16px; }
.hud-tip-tag.is-active { color: #56d364; background: rgba(63, 185, 80, .14); }
.hud-tip-desc { margin-top: 5px; padding-left: 16px; font-size: 12px; color: #c9d1d9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ------------------------------------------------------------------ star labels (#glx-labels) */
.hud-label {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
  white-space: nowrap;
  will-change: transform, opacity;
  opacity: 0;
  transform: translate3d(-9999px, 0, 0);
}
.hud-label.is-off { visibility: hidden; }
.hud-label.is-em { z-index: 2; }
.hud-label-in {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 18px;
  padding: 0 4px;
  transform: translate(8px, -50%);
  font: 600 11px/1 var(--hud-font);
  letter-spacing: .015em;
  color: rgba(236, 242, 248, .92);
  text-shadow: 0 0 2px rgba(1, 4, 9, .95), 0 0 7px rgba(1, 4, 9, .85), 0 1px 2px rgba(0, 0, 0, .9);
  -webkit-font-smoothing: antialiased;
}
.hud-label.is-left .hud-label-in { flex-direction: row-reverse; transform: translate(calc(-100% - 8px), -50%); }
.hud-label-dot {
  width: 5px;
  height: 5px;
  flex: none;
  border-radius: 50%;
  background: var(--c, #e6edf3);
  box-shadow: 0 0 6px var(--c, #e6edf3);
}
.hud-label.is-em .hud-label-in {
  height: 24px;
  gap: 7px;
  padding: 0 10px 0 8px;
  border-radius: 999px;
  border: 1px solid rgba(240, 246, 252, .22);
  border-color: color-mix(in srgb, var(--c, #e6edf3) 50%, transparent);
  background: rgba(13, 17, 23, .8);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .45), 0 0 18px -6px var(--c, #58a6ff);
  color: #fff;
  font-size: 12px;
  text-shadow: none;
}
.hud-label.is-em.is-left .hud-label-in { padding: 0 8px 0 10px; }
.hud-label.is-em .hud-label-dot { width: 7px; height: 7px; box-shadow: 0 0 0 2px rgba(1, 4, 9, .6), 0 0 9px var(--c, #e6edf3); }

/* ------------------------------------------------------------------ merge header + terminal */
.hud-merge { padding: 14px; }
.hud-merge-top { display: flex; align-items: center; gap: 12px; }
.hud-merge-avs { position: relative; display: flex; align-items: center; flex: none; padding-right: 4px; }
.hud-merge-avs .hud-avatar.is-b { margin-left: -12px; }
.hud-merge-avs .hud-avatar.is-a { z-index: 1; }
.hud-merge-badge {
  position: absolute;
  right: -2px;
  bottom: -3px;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(13, 17, 23, .95);
  background: var(--hud-accent-2);
  color: #fff;
}
.hud-merge-titles { min-width: 0; }
.hud-merge-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 8px; font-size: 16px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; }
.hud-merge-login { color: #f0f6fc; text-decoration: none; }
.hud-merge-login:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(240, 246, 252, .4); }
.hud-merge-op {
  font-weight: 400;
  background: var(--hud-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hud-merge-sub { margin-top: 2px; font-size: 12px; color: var(--hud-muted); }
.hud-term {
  margin-top: 12px;
  padding: 10px 12px 9px;
  border-radius: 10px;
  border: 1px solid rgba(240, 246, 252, .08);
  background: rgba(1, 4, 9, .62);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03), inset 0 0 24px rgba(0, 0, 0, .35);
  font-family: var(--hud-mono);
  font-size: 12.5px;
  line-height: 1.5;
  color: #e6edf3;
}
.hud-term-line { min-height: 1.5em; white-space: pre-wrap; overflow-wrap: anywhere; }
.hud-term-prompt { color: var(--hud-green); }
.hud-term-prompt:not(:empty) { margin-right: 1ch; }
.hud-term-caret {
  display: inline-block;
  width: .58em;
  height: 1.12em;
  margin-left: 1px;
  vertical-align: -.2em;
  border-radius: 1px;
  background: #c9d1d9;
  box-shadow: 0 0 8px rgba(201, 209, 217, .45);
  animation: hud-blink 1.06s steps(1, end) infinite;
}
.hud-term.is-typing .hud-term-caret { animation: none; }
.hud-term-sub { min-height: 1.45em; color: var(--hud-muted); font-size: 11.5px; }
.hud-term-sub:empty { display: none; }
.hud-merge-sumbtn { margin-top: 10px; }
.hud-merge-sumbtn .hud-ico { color: var(--hud-green); }
.hud-merge-sumbtn[hidden] { display: none; }

/* ------------------------------------------------------------------ merge summary */
.hud-summary {
  top: 50%;
  right: calc(24px + env(safe-area-inset-right, 0px));
  width: 396px;
  max-height: calc(100% - 176px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(120% 60% at 100% 0%, rgba(63, 185, 80, .10), transparent 60%),
    linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 120px),
    rgba(13, 17, 23, .76);
  transform: translate(22px, -50%) scale(.985);
}
.hud-summary.is-visible { transform: translate(0, -50%); }
.hud-sum-scroll {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 18px;
  scrollbar-width: thin;
  scrollbar-color: rgba(240, 246, 252, .16) transparent;
}
.hud-sum-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.hud-sum-check {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  color: #fff;
  background: radial-gradient(circle at 32% 28%, #6fe07c, #238636 72%);
  box-shadow: 0 0 0 4px rgba(63, 185, 80, .16), 0 0 26px rgba(63, 185, 80, .5);
}
.hud-summary.is-visible .hud-sum-check { animation: hud-pop .7s cubic-bezier(.2, 1.6, .4, 1) both .12s; }
.hud-sum-close { align-self: start; margin: -6px -8px 0 0; }
.hud-sum-title { font-size: 18px; font-weight: 650; letter-spacing: -.012em; color: #f0f6fc; }
.hud-sum-strategy { margin-top: 2px; font-family: var(--hud-mono); font-size: 11.5px; color: var(--hud-muted); }
.hud-commit {
  margin: 14px 0;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid rgba(240, 246, 252, .08);
  background: rgba(1, 4, 9, .56);
  font-family: var(--hud-mono);
  font-size: 12px;
  line-height: 1.65;
  color: #c9d1d9;
  overflow-wrap: anywhere;
}
.hud-commit-k { color: var(--hud-faint); }
.hud-commit-sha { color: var(--hud-yellow); }
.hud-commit-ref { color: #56d4dd; }
.hud-commit-dim { color: var(--hud-orange); }
.hud-summary .hud-tile { padding: 9px 8px 8px; }
.hud-summary .hud-tile-v { font-size: 17px; }
.hud-conflicts { display: flex; flex-direction: column; gap: 4px; font-family: var(--hud-mono); font-size: 11.5px; line-height: 1.4; }
.hud-conflicts > li {
  padding: 6px 9px;
  border-radius: 8px;
  border: 1px solid rgba(240, 136, 62, .16);
  background: linear-gradient(90deg, rgba(240, 136, 62, .09), rgba(63, 185, 80, .06));
  overflow-wrap: anywhere;
}
.hud-summary.is-visible .hud-conflicts > li { animation: hud-fade-up .45s var(--hud-ease) both .25s; }
.hud-conflicts.is-clamped .hud-cf-extra { display: none; }
.hud-cf-warn { color: var(--hud-orange); font-weight: 600; }
.hud-cf-in { color: var(--hud-faint); }
.hud-cf-name { color: #f0f6fc; }
.hud-cf-ok { color: #56d364; }
.hud-remnant {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr);
  gap: 12px;
  margin-top: 16px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(240, 246, 252, .09);
  background: linear-gradient(135deg, rgba(121, 192, 255, .09), rgba(210, 168, 255, .08) 55%, rgba(255, 123, 114, .07));
}
.hud-remnant-emoji { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: rgba(1, 4, 9, .35); font-size: 26px; line-height: 1; }
.hud-remnant-k { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--hud-faint); }
.hud-remnant-name { margin-top: 2px; font-size: 15px; font-weight: 650; color: #f0f6fc; }
.hud-remnant-blurb { margin-top: 3px; font-size: 12.5px; line-height: 1.45; color: var(--hud-muted); }
.hud-sum-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.hud-sum-actions .hud-btn { justify-content: center; }
.hud-sum-explore { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.hud-explore { justify-content: center; min-width: 0; padding: 0 10px; color: #c9d1d9; }
.hud-explore > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.hud-explore .hud-avatar { border-width: 1px; box-shadow: none; }

/* ------------------------------------------------------------------ find-a-star palette (mounted on body) */
.hud-s {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal, 40);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 14vh 12px 12px;
  font-family: var(--hud-font);
  font-size: 13px;
  line-height: 1.45;
  color: var(--hud-text);
  -webkit-font-smoothing: antialiased;
  pointer-events: none;
  visibility: hidden;
  transition: visibility 0s linear .26s;
}
.hud-s.is-open { pointer-events: auto; visibility: visible; transition-delay: 0s; }
.hud-s-backdrop {
  position: absolute;
  inset: 0;
  background: radial-gradient(120% 90% at 50% 15%, rgba(1, 4, 9, .38), rgba(1, 4, 9, .72));
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity .24s var(--hud-ease);
}
.hud-s.is-open .hud-s-backdrop { opacity: 1; }
.hud-s-box {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(600px, 100%);
  max-height: calc(86vh - 12px);
  overflow: hidden;
  border-radius: 16px;
  border: 1px solid rgba(240, 246, 252, .14);
  background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 80px), rgba(13, 17, 23, .9);
  box-shadow: 0 32px 90px rgba(0, 0, 0, .65), 0 0 0 1px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .06);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  backdrop-filter: blur(22px) saturate(160%);
  opacity: 0;
  transform: translateY(-10px) scale(.98);
  transition: opacity .2s var(--hud-ease), transform .28s var(--hud-ease);
}
.hud-s.is-open .hud-s-box { opacity: 1; transform: none; }
.hud-s-field {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 58px;
  padding: 0 12px 0 18px;
  border-bottom: 1px solid rgba(240, 246, 252, .08);
  flex: none;
  transition: box-shadow .2s;
}
.hud-s-field:focus-within { box-shadow: inset 0 -1px 0 rgba(88, 166, 255, .55); }
.hud-s-ico { color: var(--hud-muted); }
.hud-s-input {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: #f0f6fc;
  font: 400 17px/1.2 var(--hud-font);
  letter-spacing: -.005em;
  caret-color: var(--hud-accent);
}
.hud-s-input:focus-visible { outline: none; }
.hud-s-input::placeholder { color: var(--hud-faint); }
.hud-s-esc {
  appearance: none;
  height: 24px;
  padding: 0 8px;
  border-radius: 6px;
  border: 1px solid rgba(240, 246, 252, .16);
  border-bottom-width: 2px;
  background: rgba(240, 246, 252, .05);
  color: var(--hud-muted);
  font: 600 11px/1 var(--hud-mono);
  cursor: pointer;
  transition: color .15s, background .15s;
}
.hud-s-esc:hover { color: var(--hud-text); background: rgba(240, 246, 252, .1); }
.hud-s-results { min-height: 0; overflow-y: auto; padding: 4px 6px 6px; scrollbar-width: thin; }
.hud-s-head { padding: 9px 12px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--hud-faint); }
.hud-s-list { list-style: none; margin: 0; padding: 0; }
.hud-s-item {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) auto 16px;
  align-items: center;
  gap: 12px;
  min-height: 50px;
  padding: 6px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: background .12s;
}
.hud-s-item.is-active { background: rgba(56, 139, 253, .13); box-shadow: inset 0 0 0 1px rgba(56, 139, 253, .26); }
.hud-s-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.hud-s-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.hud-s-name { font-size: 14px; font-weight: 600; color: #e6edf3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-s-hl { background: none; color: #79c0ff; font-weight: 700; text-decoration: underline; text-decoration-color: rgba(121, 192, 255, .45); text-underline-offset: 3px; }
.hud-s-sub { font-size: 12px; color: var(--hud-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-s-stars { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--hud-muted); font-variant-numeric: tabular-nums; }
.hud-s-stars .hud-ico { color: var(--hud-yellow); }
.hud-s-go { color: var(--hud-muted); font-size: 13px; opacity: 0; transform: translateX(-3px); transition: opacity .15s, transform .2s var(--hud-ease); }
.hud-s-item.is-active .hud-s-go { opacity: 1; transform: none; }
.hud-s-empty { padding: 26px 12px 28px; text-align: center; color: var(--hud-muted); }
.hud-s-foot {
  display: flex;
  align-items: center;
  gap: 18px;
  height: 38px;
  padding: 0 16px;
  flex: none;
  border-top: 1px solid rgba(240, 246, 252, .08);
  background: rgba(1, 4, 9, .25);
  font-size: 11.5px;
  color: var(--hud-faint);
}
.hud-s-foot > span { display: inline-flex; align-items: center; gap: 5px; }
.hud-s-foot .hud-kbd { min-width: 18px; height: 18px; font-size: 10.5px; }

/* ------------------------------------------------------------------ keyframes */
@keyframes hud-rise { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes hud-fade-up { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@keyframes hud-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes hud-blink { 50% { opacity: 0; } }
@keyframes hud-spin { to { transform: rotate(1turn); } }
@keyframes hud-ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(2.8); opacity: 0; } }
@keyframes hud-orb { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.06); filter: brightness(1.3); } }
@keyframes hud-pop { from { opacity: 0; transform: scale(.4) rotate(-20deg); } to { opacity: 1; transform: none; } }

/* ------------------------------------------------------------------ touch + small screens */
@media (pointer: coarse) {
  .hud-icon-btn { width: 44px; height: 44px; }
  .hud-btn { height: 44px; }
  .hud-fact { min-height: 44px; }
  .hud-lang { height: 40px; }
}

@media (max-width: 720px) {
  .hud-left {
    top: calc(64px + env(safe-area-inset-top, 0px));
    left: calc(10px + env(safe-area-inset-left, 0px));
    right: calc(10px + env(safe-area-inset-right, 0px));
    bottom: auto;
    max-height: calc(100% - 64px - 150px);
    width: auto;
    justify-content: flex-start;
    gap: 8px;
  }
  .hud-left > .hud-legend { width: 100%; }
  .hud-prof-head { padding: 8px 6px 8px 8px; gap: 10px; }
  .hud-prof-head .hud-avatar { width: 38px !important; height: 38px !important; font-size: 14px !important; }
  .hud-prof-name { font-size: 15px; }
  .hud-icon-btn { width: 44px; height: 44px; }
  .hud-collapse { align-self: center; }
  .hud-prof-inner { padding: 0 12px 12px; }
  .hud-fact { min-height: 44px; }

  .hud-legend { padding: 6px; border-radius: 999px; }
  .hud-legend-head, .hud-legend-more { display: none; }
  .hud-legend-list {
    flex-direction: row;
    gap: 6px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 18px), transparent);
    mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 18px), transparent);
  }
  .hud-legend-list::-webkit-scrollbar { display: none; }
  .hud-legend-list > li, .hud-lang-extra { display: block; flex: none; scroll-snap-align: start; }
  .hud-lang {
    width: auto;
    height: 36px;
    padding: 0 12px;
    gap: 8px;
    border-radius: 999px;
    grid-template-columns: 9px auto auto;
    background: rgba(240, 246, 252, .05);
  }
  .hud-lang-dot { width: 9px; height: 9px; }
  .hud-lang-bar { display: none; }

  .hud-card, .hud-summary {
    top: auto;
    left: 0;
    right: 0;
    bottom: 0;
    width: auto;
    max-height: 70vh;
    max-height: 70dvh;
    border-radius: 20px 20px 0 0;
    border-bottom: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transform: translateY(104%);
  }
  .hud-summary.is-visible, .hud-card.is-visible { transform: none; }
  .hud-grip { display: block; flex: none; width: 38px; height: 4px; margin: 8px auto 0; border-radius: 2px; background: rgba(240, 246, 252, .22); }
  .hud-card-bar { padding-top: 4px; }
  .hud-card-head { grid-template-columns: 44px minmax(0, 1fr); }
  .hud-orb { width: 44px; height: 44px; }
  .hud-tiles-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hud-btn { height: 44px; }

  .hud-s { padding-top: 10px; }
  .hud-s-box { max-height: calc(100% - 20px); }
  .hud-s-foot { display: none; }
  .hud-s-item { min-height: 54px; }
  .hud-tip { max-width: 240px; }
}

@media (max-width: 720px) and (max-height: 560px) {
  .hud-left { max-height: calc(100% - 64px - 12px); }
}

/* ------------------------------------------------------------------ reduced motion */
@media (prefers-reduced-motion: reduce) {
  .hud *, .hud *::before, .hud *::after, .hud-s, .hud-s *, .hud-label {
    animation-duration: .001ms !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    transition-delay: 0s !important;
  }
}

/* ---- 65-chrome.css ---- */
/* Gitlaxy — 65-chrome.css: intro, loading, toasts, toolbar, timeline, merge bar, ticker. */
.ch-intro, .ch-loading, .ch-toolbar, .ch-timeline, .ch-mergebar {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .35s var(--ease), transform .35s var(--ease), visibility 0s linear .35s;
}
.ch-show {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity .35s var(--ease), transform .35s var(--ease), visibility 0s;
}

/* ---------------- intro */
.ch-intro {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(ellipse 70% 60% at 50% 48%, rgba(3, 5, 11, .25), rgba(3, 5, 11, .8) 75%);
  transform: scale(1.03);
}
.ch-intro.ch-show { transform: none; }
.ch-intro-inner {
  width: min(640px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  text-align: center;
}
.ch-eyebrow {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: rgba(13, 17, 23, .5);
  color: var(--muted);
  font: 600 12px/1 var(--font);
  letter-spacing: .14em;
  text-transform: uppercase;
}
.ch-wordmark {
  margin: 0;
  font: 800 clamp(64px, 13vw, 132px)/0.95 var(--font);
  letter-spacing: -.045em;
  background: linear-gradient(90deg, #79c0ff, #d2a8ff, #ff7b72, #d2a8ff, #79c0ff);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 32px rgba(163, 113, 247, .35));
  animation: ch-shimmer 8s linear infinite;
}
@keyframes ch-shimmer { to { background-position: -200% 0; } }
.ch-tagline { margin: -4px 0 8px; color: #c9d1d9; font-size: clamp(16px, 2.2vw, 20px); }
.ch-launch { display: flex; gap: 10px; width: 100%; max-width: 520px; }
.ch-field {
  flex: 1;
  display: flex;
  align-items: center;
  height: 52px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: rgba(13, 17, 23, .72);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.ch-field:focus-within { border-color: rgba(121, 192, 255, .7); box-shadow: 0 0 0 4px rgba(56, 139, 253, .18); }
.ch-at { color: var(--muted); font: 600 18px/1 var(--mono); margin-right: 4px; }
.ch-input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font-size: 17px; }
.ch-input::placeholder { color: var(--faint); }
.ch-go { height: 52px; padding: 0 26px; font-size: 16px; }
.ch-error { min-height: 1.2em; margin: -6px 0 0; color: var(--accent-3); font-size: 14px; }
.ch-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.ch-link { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 14px; padding: 4px; }
.ch-link:hover { text-decoration: underline; }
.ch-merge { width: 100%; max-width: 560px; }
.ch-merge-row { display: flex; align-items: center; gap: 8px; }
.ch-field-sm { height: 44px; padding: 0 14px; }
.ch-field-sm .ch-input { font-size: 15px; }
.ch-x { color: var(--accent-2); font-size: 22px; }
.ch-merge .btn { height: 44px; }
.ch-footer { margin: 18px 0 0; color: var(--faint); font-size: 12px; }
.ch-shake { animation: ch-shake .4s var(--ease); }
@keyframes ch-shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }

/* ---------------- loading */
.ch-loading {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 18px;
  background: rgba(3, 5, 11, .55);
  z-index: var(--z-modal);
}
.ch-spinner { position: relative; width: 64px; height: 64px; animation: ch-spin 1.6s linear infinite; }
.ch-spinner i { position: absolute; left: 50%; top: 0; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #79c0ff; box-shadow: 0 0 14px #79c0ff; transform-origin: 5px 32px; }
.ch-spinner i:nth-child(2) { background: #d2a8ff; box-shadow: 0 0 14px #d2a8ff; transform: rotate(120deg); }
.ch-spinner i:nth-child(3) { background: #ff7b72; box-shadow: 0 0 14px #ff7b72; transform: rotate(240deg); }
@keyframes ch-spin { to { transform: rotate(360deg); } }
.ch-loading-msg { margin: 0; color: var(--text); font-size: 16px; }

/* ---------------- toasts */
.ch-toasts {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: min(560px, calc(100vw - 24px));
  z-index: var(--z-toast);
}
.ch-toast {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 100%;
  padding: 10px 10px 10px 14px;
  border-left: 3px solid var(--accent);
  pointer-events: auto;
  animation: ch-in .3s var(--ease);
}
.ch-toast-success { border-left-color: var(--green); }
.ch-toast-warn { border-left-color: var(--yellow); }
.ch-toast-error { border-left-color: var(--red); }
.ch-toast-icon { color: var(--muted); display: grid; }
.ch-toast-success .ch-toast-icon { color: var(--green); }
.ch-toast-error .ch-toast-icon { color: var(--red); }
.ch-toast-text { flex: 1; font-size: 14px; }
.ch-toast-action { border: 0; border-radius: 999px; padding: 6px 12px; background: rgba(56, 139, 253, .2); color: #79c0ff; font-weight: 600; cursor: pointer; white-space: nowrap; }
.ch-toast-close { border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; padding: 4px; }
.ch-out { opacity: 0 !important; transform: translateY(-6px); transition: opacity .25s var(--ease), transform .25s var(--ease); }
@keyframes ch-in { from { opacity: 0; transform: translateY(-8px); } }

/* ---------------- toolbar */
.ch-toolbar { position: fixed; top: 16px; right: 16px; display: flex; gap: 8px; }
.ch-tool { position: relative; width: 40px; height: 40px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.ch-tool::after {
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  padding: 5px 9px;
  border-radius: 8px;
  background: var(--panel-strong);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(-4px);
  pointer-events: none;
  transition: opacity .15s var(--ease), transform .15s var(--ease);
}
.ch-tool:hover::after, .ch-tool:focus-visible::after { opacity: 1; transform: none; }

/* ---------------- timeline & merge bar */
.ch-timeline, .ch-mergebar {
  position: fixed;
  left: 50%;
  bottom: 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  width: min(640px, calc(100vw - 32px));
  padding: 10px 18px 10px 10px;
  border-radius: 999px;
  transform: translate(-50%, 12px);
}
.ch-timeline.ch-show, .ch-mergebar.ch-show { transform: translate(-50%, 0); }
.ch-track { flex: 1; min-width: 0; }
.ch-ends { display: flex; justify-content: space-between; margin-top: 2px; color: var(--muted); font-size: 11px; }
.ch-date { min-width: 92px; text-align: right; font: 700 17px/1 var(--font); font-variant-numeric: tabular-nums; }
.ch-range {
  --p: 0%;
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 18px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
.ch-range::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, #79c0ff, #d2a8ff var(--p), rgba(240, 246, 252, .14) var(--p)); }
.ch-range::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, #79c0ff, #d2a8ff var(--p), rgba(240, 246, 252, .14) var(--p)); }
.ch-range::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px rgba(210, 168, 255, .9); }
.ch-range::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 12px rgba(210, 168, 255, .9); }
.ch-mb-main { flex: 1; min-width: 0; }
.ch-mb-label { margin-bottom: 6px; font: 600 13px/1 var(--mono); color: #d2a8ff; }
.ch-mb-bar { height: 4px; border-radius: 4px; background: rgba(240, 246, 252, .14); overflow: hidden; }
.ch-mb-fill { height: 100%; background: linear-gradient(90deg, #79c0ff, #d2a8ff, #ff7b72); transform: scaleX(0); transform-origin: left; }

/* ---------------- ticker */
.ch-ticker { position: fixed; right: 16px; bottom: 92px; display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100vw - 32px)); }
.ch-tick { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; animation: ch-slide .35s var(--ease); transition: opacity .4s var(--ease); }
.ch-tick-icon { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; color: #0d1117; }
.ch-tick-body { display: flex; flex-direction: column; min-width: 0; }
.ch-tick-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
.ch-tick-sub { color: var(--muted); font-size: 11px; }
@keyframes ch-slide { from { opacity: 0; transform: translateX(16px); } }

@media (max-width: 720px) {
  .ch-launch, .ch-merge-row { flex-direction: column; align-items: stretch; }
  .ch-field { flex: none; }
  .ch-x { align-self: center; }
  .ch-toolbar { top: auto; bottom: 86px; right: 12px; flex-direction: column; }
  .ch-tool::after { display: none; }
  .ch-ticker { display: none; }
  .ch-timeline, .ch-mergebar { bottom: 12px; }
}

<body>
<canvas id="glx-canvas" role="img" aria-label="Interactive 3D galaxy of GitHub repositories" tabindex="-1"></canvas>
<div id="glx-vignette" aria-hidden="true"></div>
<div id="glx-labels" aria-hidden="true"></div>
<div id="glx-hud-root"></div>
<div id="glx-chrome-root"></div>
<noscript><div class="glx-fatal"><h1>Gitlaxy</h1><p>Gitlaxy needs JavaScript to chart the stars.</p></div></noscript>
<script>
// ---- 00-core.js ----
/* Gitlaxy — 00-core.js
 * Shared namespace, config, utilities, math, colors, event bus, render buffers and icons.
 * Every other module depends on this file. It only defines things on window.GLX (no side effects).
 */
(() => {
  'use strict';
  const GLX = (window.GLX = window.GLX || {});
  GLX.version = '1.0.0';

  GLX.config = {
    GALAXY_RADIUS: 1.0,
    MAX_STARS: 300,
    PARTICLES_DESKTOP: 32000,
    PARTICLES_MOBILE: 14000,
    PARTICLES_MERGE_DESKTOP: 14000,
    PARTICLES_MERGE_MOBILE: 6000,
    ROTATION_SPEED: 0.025, // rad/s, single-galaxy mode rotation about +Y
    ARM_TWIST: 4.6, // radians of spiral-arm winding from core (r=0) to rim (r=1)
    MAX_SPRITES: 16000,
    CACHE_TTL_MS: 60 * 60 * 1000
  };

  // ---------------------------------------------------------------- util
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOutExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));

  /** FNV-1a 32-bit string hash → uint32 */
  function hashStr(str) {
    let h = 0x811c9dc5;
    const s = String(str);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  /** Seeded PRNG (mulberry32). Returns () => float in [0, 1). */
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** Standard normal sample using a PRNG from rng(). */
  function gauss(r) {
    let u = 0, v = 0;
    while (u === 0) u = r();
    while (v === 0) v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  const pick = (r, arr) => arr[Math.floor(r() * arr.length) % arr.length];

  function weightedIndex(r, weights) {
    let total = 0;
    for (let i = 0; i < weights.length; i++) total += weights[i];
    let x = r() * total;
    for (let i = 0; i < weights.length; i++) {
      x -= weights[i];
      if (x <= 0) return i;
    }
    return weights.length - 1;
  }

  const toMs = (d) => (typeof d === 'number' ? d : Date.parse(d));
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  /** 1234 → '1.2k', 25000 → '25k', 1500000 → '1.5M' */
  function fmtNum(n) {
    n = Number(n) || 0;
    const abs = Math.abs(n);
    if (abs >= 1e6) return (n / 1e6).toFixed(abs >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
    if (abs >= 1e3) return (n / 1e3).toFixed(abs >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k';
    return String(Math.round(n));
  }
  /** → 'Mar 2016' */
  function fmtDate(d) {
    const t = new Date(toMs(d));
    return MONTHS[t.getMonth()] + ' ' + t.getFullYear();
  }
  /** → 'Mar 12, 2016' */
  function fmtDateLong(d) {
    const t = new Date(toMs(d));
    return MONTHS[t.getMonth()] + ' ' + t.getDate() + ', ' + t.getFullYear();
  }
  /** → '3 days ago' */
  function timeAgo(d, now = Date.now()) {
    const sec = Math.max(0, (now - toMs(d)) / 1000);
    if (sec < 45) return 'just now';
    const table = [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]];
    for (const [unit, s] of table) {
      const v = Math.floor(sec / s);
      if (v >= 1) return v + ' ' + unit + (v > 1 ? 's' : '') + ' ago';
    }
    return 'just now';
  }

  /**
   * Tiny DOM builder. attrs: class, text, html (TRUSTED static markup only, e.g. GLX.icon()),
   * style (object), on ({event: fn}), dataset (object), any other attribute (true → empty attr).
   * Children: Nodes or strings (strings become text nodes — safe), arrays are flattened, null/false skipped.
   */
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k === 'html') node.innerHTML = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
        else if (k === 'on') for (const ev in v) node.addEventListener(ev, v[ev]);
        else if (k === 'dataset') Object.assign(node.dataset, v);
        else node.setAttribute(k, v === true ? '' : String(v));
      }
    }
    for (const c of children.flat(Infinity)) {
      if (c == null || c === false) continue;
      node.append(c instanceof Node ? c : String(c));
    }
    return node;
  }

  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);

  const PREFIX = 'gitlaxy:';
  function makeStore(getStore) {
    return {
      get(key, fallback = null) {
        try {
          const v = getStore().getItem(PREFIX + key);
          return v == null ? fallback : JSON.parse(v);
        } catch (e) {
          return fallback;
        }
      },
      set(key, value) {
        try {
          getStore().setItem(PREFIX + key, JSON.stringify(value));
          return true;
        } catch (e) {
          return false;
        }
      },
      del(key) {
        try {
          getStore().removeItem(PREFIX + key);
        } catch (e) { /* ignore */ }
      }
    };
  }
  /** JSON localStorage wrapper with 'gitlaxy:' prefix; .session uses sessionStorage. Never throws. */
  const storage = makeStore(() => window.localStorage);
  storage.session = makeStore(() => window.sessionStorage);

  const prefersReducedMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const isMobile = () =>
    !!((window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || Math.min(window.innerWidth || 1e4, window.innerHeight || 1e4) < 560);
  const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

  GLX.util = {
    clamp, lerp, smoothstep, easeOutCubic, easeInOutCubic, easeOutExpo,
    hashStr, rng, gauss, pick, weightedIndex, toMs,
    fmtNum, fmtDate, fmtDateLong, timeAgo, MONTHS,
    el, esc, storage, prefersReducedMotion, isMobile, sleep
  };

  // ---------------------------------------------------------------- math (column-major mat4, gl-matrix conventions)
  const math = {
    mat4() {
      const m = new Float32Array(16);
      m[0] = m[5] = m[10] = m[15] = 1;
      return m;
    },
    identity(out) {
      out.fill(0);
      out[0] = out[5] = out[10] = out[15] = 1;
      return out;
    },
    perspective(out, fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
      out.fill(0);
      out[0] = f / aspect;
      out[5] = f;
      out[10] = (far + near) * nf;
      out[11] = -1;
      out[14] = 2 * far * near * nf;
      return out;
    },
    lookAt(out, eye, center, up) {
      let z0 = eye[0] - center[0], z1 = eye[1] - center[1], z2 = eye[2] - center[2];
      let len = Math.hypot(z0, z1, z2);
      if (len < 1e-9) return math.identity(out);
      z0 /= len; z1 /= len; z2 /= len;
      let x0 = up[1] * z2 - up[2] * z1, x1 = up[2] * z0 - up[0] * z2, x2 = up[0] * z1 - up[1] * z0;
      len = Math.hypot(x0, x1, x2);
      if (len < 1e-9) { x0 = 0; x1 = 0; x2 = 0; } else { x0 /= len; x1 /= len; x2 /= len; }
      const y0 = z1 * x2 - z2 * x1, y1 = z2 * x0 - z0 * x2, y2 = z0 * x1 - z1 * x0;
      out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
      out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
      out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
      out[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
      out[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
      out[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
      out[15] = 1;
      return out;
    },
    /** out = a × b */
    multiply(out, a, b) {
      const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
      const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
      const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
      const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
      for (let i = 0; i < 16; i += 4) {
        const b0 = b[i], b1 = b[i + 1], b2 = b[i + 2], b3 = b[i + 3];
        out[i] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
        out[i + 1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
        out[i + 2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
        out[i + 3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
      }
      return out;
    },
    /** Rotation matrix about an arbitrary axis (radians). */
    rotationAxis(out, axis, rad) {
      let x = axis[0], y = axis[1], z = axis[2];
      const len = Math.hypot(x, y, z) || 1;
      x /= len; y /= len; z /= len;
      const s = Math.sin(rad), c = Math.cos(rad), t = 1 - c;
      out[0] = x * x * t + c; out[1] = y * x * t + z * s; out[2] = z * x * t - y * s; out[3] = 0;
      out[4] = x * y * t - z * s; out[5] = y * y * t + c; out[6] = z * y * t + x * s; out[7] = 0;
      out[8] = x * z * t + y * s; out[9] = y * z * t - x * s; out[10] = z * z * t + c; out[11] = 0;
      out[12] = 0; out[13] = 0; out[14] = 0; out[15] = 1;
      return out;
    },
    rotationY(out, rad) {
      return math.rotationAxis(out, [0, 1, 0], rad);
    },
    translation(out, x, y, z) {
      math.identity(out);
      out[12] = x; out[13] = y; out[14] = z;
      return out;
    },
    /** Affine transform of a point (w = 1, no perspective divide). out may be any 3-array. */
    transformPoint(out, m, x, y, z) {
      out[0] = m[0] * x + m[4] * y + m[8] * z + m[12];
      out[1] = m[1] * x + m[5] * y + m[9] * z + m[13];
      out[2] = m[2] * x + m[6] * y + m[10] * z + m[14];
      return out;
    },
    /** Full vec4 transform. */
    transformVec4(out, m, x, y, z, w) {
      out[0] = m[0] * x + m[4] * y + m[8] * z + m[12] * w;
      out[1] = m[1] * x + m[5] * y + m[9] * z + m[13] * w;
      out[2] = m[2] * x + m[6] * y + m[10] * z + m[14] * w;
      out[3] = m[3] * x + m[7] * y + m[11] * z + m[15] * w;
      return out;
    },
    v3: {
      add: (o, a, b) => { o[0] = a[0] + b[0]; o[1] = a[1] + b[1]; o[2] = a[2] + b[2]; return o; },
      sub: (o, a, b) => { o[0] = a[0] - b[0]; o[1] = a[1] - b[1]; o[2] = a[2] - b[2]; return o; },
      scale: (o, a, s) => { o[0] = a[0] * s; o[1] = a[1] * s; o[2] = a[2] * s; return o; },
      dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
      cross: (o, a, b) => {
        const x = a[1] * b[2] - a[2] * b[1], y = a[2] * b[0] - a[0] * b[2], z = a[0] * b[1] - a[1] * b[0];
        o[0] = x; o[1] = y; o[2] = z; return o;
      },
      len: (a) => Math.hypot(a[0], a[1], a[2]),
      dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
      normalize: (o, a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; o[0] = a[0] / l; o[1] = a[1] / l; o[2] = a[2] / l; return o; },
      lerp: (o, a, b, t) => { o[0] = a[0] + (b[0] - a[0]) * t; o[1] = a[1] + (b[1] - a[1]) * t; o[2] = a[2] + (b[2] - a[2]) * t; return o; }
    }
  };
  GLX.math = math;

  // ---------------------------------------------------------------- color
  // GitHub linguist colors (subset). Use GLX.color.langColor() which brightens them for a dark sky.
  const LANG_COLORS = {
    JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5', Java: '#b07219', Go: '#00ADD8', Rust: '#dea584',
    'C++': '#f34b7d', C: '#555555', 'C#': '#178600', Ruby: '#701516', PHP: '#4F5D95', Swift: '#F05138', Kotlin: '#A97BFF',
    Dart: '#00B4AB', Shell: '#89e051', HTML: '#e34c26', CSS: '#663399', SCSS: '#c6538c', Vue: '#41b883', Svelte: '#ff3e00',
    'Jupyter Notebook': '#DA5B0B', R: '#198CE7', Scala: '#c22d40', Elixir: '#6e4a7e', Haskell: '#5e5086', Lua: '#000080',
    Perl: '#0298c3', 'Objective-C': '#438eff', 'Objective-C++': '#6866fb', Clojure: '#db5855', Erlang: '#B83998', OCaml: '#ef7a08',
    Zig: '#ec915c', Nix: '#7e7eff', Dockerfile: '#384d54', HCL: '#844FBA', PowerShell: '#012456', 'Vim Script': '#199f4b',
    'Emacs Lisp': '#c065db', TeX: '#3D6117', Makefile: '#427819', CMake: '#DA3434', Julia: '#a270ba', MATLAB: '#e16737',
    Groovy: '#4298b8', Assembly: '#6E4C13', Solidity: '#AA6746', Elm: '#60B5CC', 'F#': '#b845fc', Nim: '#ffc200',
    Crystal: '#000100', Astro: '#ff5a03', MDX: '#fcb32c', Fortran: '#4d41b1', Gleam: '#ffaff3', Mojo: '#ff4c1f',
    WebAssembly: '#04133b', GLSL: '#5686a5', HLSL: '#aace60', Batchfile: '#C1F12E', Markdown: '#083fa1', Handlebars: '#f7931e',
    Less: '#1d365d', Stylus: '#ff6347', CoffeeScript: '#244776', Processing: '#0096D8', Verilog: '#b2b7f8', VHDL: '#adb2cb',
    SystemVerilog: '#DAE1C2', Cuda: '#3A4E3A', Ada: '#02f88c', Pascal: '#E3F171', Prolog: '#74283c', Racket: '#3c5caa',
    Scheme: '#1e4aec', 'Common Lisp': '#3fb68b', Haxe: '#df7900', D: '#ba595e', Raku: '#0000fb', Hack: '#878787',
    Apex: '#1797c0', Bicep: '#519aba', PureScript: '#1D222D', ReScript: '#ed5051', Reason: '#ff5847', Smarty: '#f0c040',
    Pug: '#a86454', 'Visual Basic .NET': '#945db7', Liquid: '#67b8de', Jsonnet: '#0064bd', Starlark: '#76d275',
    Blade: '#f7523f', Twig: '#c1d026', Mustache: '#724b3b', Jinja: '#a52a22', EJS: '#a91e50', Roff: '#ecdebe',
    YAML: '#cb171e', Cairo: '#ff4a48', Move: '#4a137a', Odin: '#60AFFE', Janet: '#0886a5', Coq: '#d0b68c', Agda: '#315665',
    Idris: '#b30000', Smalltalk: '#596706', Tcl: '#e4cc98', AutoHotkey: '#6594b9', GDScript: '#355570', Metal: '#8f14e9',
    Lean: '#8a6cff', Vala: '#a56de2', Wren: '#383838', Ballerina: '#FF5000', Bash: '#89e051', Cython: '#fedf5b'
  };

  function hexToRgb(hex) {
    let h = String(hex).replace('#', '');

        repo: r,
        pos: [rad * Math.cos(theta), y, rad * Math.sin(theta)],
        color: color.langColor(r.language),
        size: (0.010 + 0.0085 * Math.log10(nStars + 1)) * (isFork ? 0.65 : 1),

        z = r * Math.sin(theta);

        z = r * Math.sin(theta);

        alpha = 0.1 + R() * 0.14;

        alpha = Math.min(1, alpha * 1.7);

      pos[o3] = x; pos[o3 + 1] = y; pos[o3 + 2] = z;

    const nebulae = [];
    for (let k = 0; k < arms.length; k++) {
      const count = Math.round(6 + 4 * Math.min(1, arms[k].share * 2));
      for (let j = 0; j < count; j++) {
        const r = 0.2 + R() * 0.8;
        const theta = arms[k].angle + r * TWIST + gauss(R) * 0.12;
        const pink = R() < 0.3;
        nebulae.push({
          pos: [r * Math.cos(theta), gauss(R) * 0.012, r * Math.sin(theta)],
          size: 0.15 + R() * 0.3,
          color: pink ? mix3(arms[k].color, HII, 0.55) : mix3(arms[k].color, WHITE, 0.12),
          alpha: 0.04 + R() * 0.08,
          birth: clamp(clamp(r / 1.2, 0, 1) * 0.92 + R() * 0.06, 0, 1),
          seed: R()

    const constellations = buildConstellations(stars);
    const stats = computeStats(repos, now, profile.createdAt);
    const classification = classify(stats);
    const facts = buildFacts(stars, now);

    return {
      user,
      profile,
      seed,
      t0,
      t1,
      radius: 1.0,
      arms,
      langs,
      stars,
      particles: { count: N, pos, color: col, meta },
      nebulae,
      constellations,
      stats,
      classification,
      designation: 'GLX-' + (1000 + (seed % 9000)),

  function separateStars(stars, minSep) {
    const n = stars.length;

      let moved = false;

        const a = stars[i].pos;
        for (let j = i + 1; j < n; j++) {
          const b = stars[j].pos;
          let dx = b[0] - a[0], dz = b[2] - a[2];
          const d2 = dx * dx + dz * dz + (b[1] - a[1]) * (b[1] - a[1]);

          const push = (minSep - Math.min(d, minSep)) * 0.5;
          const ux = dx / d, uz = dz / d;
          a[0] -= ux * push; a[2] -= uz * push;
          b[0] += ux * push; b[2] += uz * push;
          moved = true;
        }
      }
      if (!moved) break;
    }
    for (const s of stars) {
      const r = Math.hypot(s.pos[0], s.pos[2]);
      if (r > 1.0) {

        s.pos[2] *= 1.0 / r;

      byLang.get(s.lang).push(s.index);

    const edges = [];

      const m = idxs.length;

      const inTree = new Uint8Array(m);
      const best = new Float64Array(m).fill(Infinity);
      const parent = new Int32Array(m).fill(-1);

        for (let v = 0; v < m; v++) if (!inTree[v] && best[v] < bu) { bu = best[v]; u = v; }
        if (u < 0) break;

        if (parent[u] >= 0) edges.push([idxs[parent[u]], idxs[u]]);
